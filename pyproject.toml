[project]
name = "newsletter-generator"
version = "0.1.0"
description = "Weekly scientific newsletter generator: collect, rank, summarise, email."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "rapidfuzz>=3.9.0",
    "python-dateutil>=2.9.0",
    "rich>=13.7.0",
    "readability-lxml>=0.8.1",
    "openai>=1.30.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0.0"]

[project.scripts]
newsletter = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["newsletter", "newsletter.collectors", "newsletter.llm"]
